<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Rehoboam Home</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#111;
       font-family:"Barlow Condensed","Bebas Neue","DIN Condensed","Arial Narrow",Impact,sans-serif;
       transition:opacity .8s}
  .lbl{position:absolute;white-space:nowrap;letter-spacing:.02em;line-height:1.05}
  .lbl b{font-weight:600;font-size:clamp(18px,3.2vmin,34px)}
  .lbl span{font-weight:300;font-size:clamp(18px,3.2vmin,34px)}
  .lbl i{display:block;font-style:normal;font-weight:400;font-size:clamp(9px,1.5vmin,15px);color:#555;letter-spacing:.06em}
  svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  svg *{fill:none;stroke:#222;stroke-width:1;vector-effect:non-scaling-stroke}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <svg id="svg"><polyline id="leader"/><polygon id="hex"/><circle id="hexdot" r="2"/></svg>
  <div class="lbl" id="lbl"><b id="l1"></b><span id="l1b"></span><i id="l2"></i><i id="l3"></i></div>
</div>
<script>
"use strict";
// ---------- shader ----------
const VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS = `
precision highp float;
uniform vec2  uRes;
uniform float uT;
uniform float uBg;      // 0 black .. 1 light paper
uniform float uThick;   // base ring thickness (fraction of height)
uniform float uOff;     // inner-disc offset -> crescent
uniform float uOffAng;  // direction of the offset
uniform float uWob;     // edge wobble amplitude
uniform float uSpike;   // spike amplitude
uniform float uDust;    // ink dust density
uniform float uMass;    // 0 ring .. 1 swelling black mass
uniform float uRad;     // ring radius

const float PI = 3.14159265;
float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float hash2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec3 x){
  vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);
  float r=length(p);
  float a=atan(p.y,p.x);
  vec2 dir=p/max(r,1e-4);

  // --- outer edge: low-freq breathing + high-freq ink roughness ---
  float n1=fbm(vec3(dir*2.2,uT*.22));
  float n2=fbm(vec3(dir*11.,uT*.55));
  float n3=noise(vec3(dir*38.,uT*1.4));
  float Rb=uRad + uWob*(n1-.5)*.06;
  float Ro=Rb + uWob*((n2-.5)*.02+(n3-.5)*.006);

  // --- spikes (thin bristles that drift around the rim) ---
  for(int i=0;i<10;i++){
    float fi=float(i);
    float ai=fi*0.63+sin(fi*12.9898)*2.2+uT*(0.02+0.01*sin(fi*7.));
    float d=abs(mod(a-ai+PI,2.*PI)-PI);
    float h=(.012+.05*fract(sin(fi*91.7)*43758.5))*uSpike*(.55+.45*sin(uT*.6+fi*3.1));
    float w=.012+.02*fract(sin(fi*37.1)*917.3);
    Ro+=h*pow(max(0.,1.-d/w),2.5);
  }

  // --- swelling black mass (scene C): radius grows and blurs ---
  float soft=.0035+uMass*.05;
  Ro+=uMass*(.05+.07*fbm(vec3(dir*3.,uT*.3)));

  float outer=1.-smoothstep(Ro-soft,Ro+soft,r);

  // --- inner white disc, offset -> crescent ---
  vec2 c=vec2(cos(uOffAng),sin(uOffAng))*uOff;
  float Ri=Rb-uThick+(n2-.5)*.004*uWob;
  float di=length(p-c);
  float innerSoft=.0018+uMass*.06;
  float inner=1.-smoothstep(Ri-innerSoft,Ri+innerSoft,di);
  float ink=outer*(1.-inner);

  // --- ink bleed haze + dust outside the rim ---
  float out_=max(r-Ro,0.);
  float rim=smoothstep(Ro-.003,Ro+.003,r);
  float haze=rim*exp(-out_/.018)*smoothstep(.42,.75,n2)*.55*uWob;
  float dustD=rim*exp(-out_/.04)*uDust*smoothstep(.35,.7,n1);
  vec2 g=floor(gl_FragCoord.xy/2.);
  float spec=step(1.-dustD*.5,hash2(g));
  // inner bleed (soft smoke just inside the black on the thick side)
  float ib=exp(-max(Ri-di,0.)/.02)*(1.-inner*0.)*smoothstep(.4,.8,n2)*.35;
  float inSide=(1.-smoothstep(Ri-.02,Ri,di));
  float a_ink=clamp(ink+haze*(1.-ink)+spec*(1.-inner)+ib*inSide*outer*.0,0.,1.);

  // --- paper ---
  vec3 paper=vec3(.915,.918,.90);
  vec3 white=vec3(.955,.957,.945);
  float vig=1.-.08*smoothstep(.3,1.,length(p));
  vec3 bg=mix(vec3(.04),paper*vig,uBg);
  vec3 disc=mix(vec3(.05),white*vig,uBg);
  vec3 col=mix(bg,disc,inner*outer);
  vec3 inkc=vec3(.035)+.03*n2;
  col=mix(col,inkc,a_ink);
  // film grain
  col+=(hash2(gl_FragCoord.xy+fract(uT)*100.)-.5)*.018;
  gl_FragColor=vec4(col,1.);
}`;

// ---------- gl setup ----------
const cv=document.getElementById('gl');
const gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true})||cv.getContext('experimental-webgl');
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['uRes','uT','uBg','uThick','uOff','uOffAng','uWob','uSpike','uDust','uMass','uRad'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));

let DPR=Math.min(window.devicePixelRatio||1,1.5);
function resize(){cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

// ---------- scenes (parameters measured from the reference clips) ----------
const SCENES=[
 { name:'ring',    // clips 1-2: thin black ring, rippling edge, a few bristles
   p:{uBg:1,uThick:.011,uOff:0,uOffAng:0,uWob:1,uSpike:.6,uDust:.25,uMass:0,uRad:.40},
   lbl:{l1:'ELEVATED SCRUTINY: ',l1b:'ГОСТИНАЯ',l2:'SPECIAL CIRCUMSTANCES',l3:'LOCATION: 41.2995°N, 69.2401°E',
        pos:{left:'3.5vw',top:'4vh'}, hex:null, dur:7},
 },
 { name:'crescent',// clip 3: white disc shifted right -> thick black crescent on the left
   p:{uBg:1,uThick:.012,uOff:.042,uOffAng:.12,uWob:1.2,uSpike:1,uDust:.55,uMass:0,uRad:.42},
   lbl:{l1:'DIVERGENCE: ',l1b:'КУХНЯ',l2:'2.39 ARC SECONDS',l3:'FOCAL POINT: ДАТЧИК ДВЕРИ',
        pos:{right:'3.5vw',bottom:'5vh'}, hex:null, dur:7},
 },
 { name:'mass',    // clip 4 (screenshot 3): ring swells into a blurred black mass
   p:{uBg:.9,uThick:.05,uOff:.05,uOffAng:.5,uWob:1.4,uSpike:1.1,uDust:.8,uMass:.6,uRad:.36},
   lbl:{l1:'DIVERGENCE: ',l1b:'ТРЕВОГА',l2:'ALL SENSORS',l3:'FOCAL POINT: 21.4813°N, 109.1202°E',
        pos:{left:'3.5vw',top:'4vh'}, hex:null, dur:7},
 },
];
const q=new URLSearchParams(location.search);
let cur=+q.get('scene')||0, tScene=0;
const P={...SCENES[cur].p}, T0=performance.now();
const fixedT=q.has('t')?+q.get('t'):null;

function setLabel(s){
  const L=s.lbl,el=document.getElementById('lbl');
  el.style.left=el.style.right=el.style.top=el.style.bottom='auto';
  Object.assign(el.style,L.pos);
  el.style.textAlign=L.pos.right?'right':'left';
  L.t0=performance.now();
}
function typeLabel(now){
  const L=SCENES[cur].lbl, k=Math.floor((now-L.t0-500)/38); // typewriter
  const cut=(s,off)=>s.slice(0,Math.max(0,Math.min(s.length,k-off)));
  const a=L.l1.length,b=a+L.l1b.length,c=b+L.l2.length;
  document.getElementById('l1').textContent=cut(L.l1,0);
  document.getElementById('l1b').textContent=cut(L.l1b,a);
  document.getElementById('l2').textContent=cut(L.l2,b);
  document.getElementById('l3').textContent=cut(L.l3,c);
}
function go(i){cur=(i+SCENES.length)%SCENES.length;tScene=performance.now();setLabel(SCENES[cur]);}
addEventListener('pointerdown',()=>go(cur+1));
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')go(+e.key-1);});
setLabel(SCENES[cur]);tScene=performance.now();

const ease=(x)=>x*x*(3-2*x);
function frame(now){
  const t=fixedT!==null?fixedT:(now-T0)/1000;
  // auto-advance
  if(fixedT===null && (now-tScene)/1000>SCENES[cur].lbl.dur) go(cur+1);
  // smooth parameter blending toward the target scene
  const tg=SCENES[cur].p, k=fixedT!==null?1:.035;
  for(const n in tg)P[n]+= (tg[n]-P[n])*k;
  // fade in from black when a scene starts
  const since=(now-tScene)/1000;
  const fade=fixedT!==null?1:ease(Math.min(1,since/1.2));
  gl.uniform2f(U.uRes,cv.width,cv.height);
  gl.uniform1f(U.uT,t);
  gl.uniform1f(U.uBg,P.uBg*fade);
  for(const n in P)if(n!=='uBg')gl.uniform1f(U[n],P[n]);
  gl.drawArrays(gl.TRIANGLES,0,3);
  typeLabel(now);
  document.getElementById('hud').style.opacity=fade;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
